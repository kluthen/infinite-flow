# Security headers shared by every location block.
#
# nginx quirk: `add_header` set inside a `location` does NOT inherit `add_header`s from an
# enclosing `server`/`http` block once that location sets even one `add_header` of its own (here,
# each location already sets its own Cache-Control). So this file is `include`d inside every single
# location in docker/nginx.conf rather than declared once at the server level.
#
# CSP: browser-only static PWA, no backend and no other origins are ever contacted.
#   - default-src/script-src 'self'    -- only same-origin scripts; no eval, no inline scripts.
#   - style-src 'self' 'unsafe-inline' -- VexFlow's SVG engraving adapter
#     (src/notation/vexflow-engraver.ts) and the score-panel measurement staging element
#     (src/components/notation/PhraseScore.vue) size elements via the DOM `style` property
#     (`svg.style.width = ...`), which CSP treats as inline style regardless of whether it was
#     written as a static `style="..."` attribute or set property-by-property from script; the
#     resulting values are computed per render, so they cannot be pinned with a style-src hash.
#     Verified empirically: without 'unsafe-inline' here, Chromium reports
#     `securitypolicyviolation` events for style-src on every notation render.
#   - font-src 'self' data:            -- VexFlow's Bravura/Academico faces (from 'vexflow/bravura')
#     are embedded as base64 `data:font/woff2` strings inside the lazy engraving chunk and loaded
#     via `new FontFace(name, \`url(${dataUri})\`)` (node_modules/vexflow/build/esm/src/font.js);
#     the CSP font-src check applies to that URL's scheme even though no network request is made.
#   - connect-src 'self'               -- the service worker's own install-time precache fetches
#     (Workbox `precacheAndRoute`) are same-origin XHR/fetch calls made from the sw.js execution
#     context, which carries this same CSP (nginx sends it on every response, including sw.js).
#   - worker-src 'self'                -- covers both the module Web Worker
#     (`src/generation-worker/browser-generation-worker.ts`) and service-worker registration itself.
#   - img-src 'self'                   -- no <img>/data-URI images are used; kept same-origin only.
#   - manifest-src 'self'              -- the PWA manifest fetch.
#   - object-src 'none'; base-uri 'self'; form-action 'self' -- no plugins, no base-tag hijacking,
#     no form submissions (there are no <form> elements in this app).
#   - frame-ancestors 'none'           -- the app must never be framed; paired with X-Frame-Options
#     below for user agents that only understand the older header.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;

# Disables every optional browser capability this release deliberately has no scope for (see
# docs/release/browser-and-offline-limits.md's "Out of scope" section): MIDI, microphone, camera,
# geolocation, USB, serial, Bluetooth and the Payment Request API.
add_header Permissions-Policy "midi=(), microphone=(), camera=(), geolocation=(), usb=(), serial=(), bluetooth=(), payment=()" always;

# HSTS is intentionally NOT set here: it belongs to whatever terminates TLS in front of this
# container (see the "Deploying behind a reverse proxy (Caddy)" section in README.md). Setting it
# here as well as on plain HTTP would be a no-op at best and a foot-gun if this container is ever
# reached directly over HTTP.
