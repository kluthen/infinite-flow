# Infinite Flow production server block. Copied to /etc/nginx/conf.d/default.conf; runs as the
# unprivileged `nginx` user on port 8080 (see ../Dockerfile). This app is a single static page with
# no client-side routing, so there is no SPA history-fallback: only real files under dist/ are ever
# served, and anything else (including a missing file under /assets/) is a plain 404.
#
# Designed to sit behind a TLS-terminating reverse proxy (see the "Deploying behind a reverse proxy
# (Caddy)" section of README.md): `absolute_redirect off` and `port_in_redirect off` keep nginx from
# ever emitting its own container-internal `:8080` in a redirect Location header, and there is no
# `server_name` restriction so it answers any Host header the proxy forwards.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # mime.types (included by the base image's nginx.conf) already maps .js to
    # application/javascript and .woff2 to font/woff2 correctly; the two locations below force the
    # two mappings the release brief calls out explicitly: `.js`/`.mjs` as text/javascript, and
    # `.webmanifest` as application/manifest+json. A `types {}` block replaces the inherited map for
    # its own context rather than extending it, so each override is scoped to a location that only
    # ever serves that one extension.

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # vite-plugin-pwa's `generateSW` build emits sw.js and workbox-<hash>.js at the site root; it
    # may also emit a registerSW.js depending on injectRegister config (this build calls
    # `registerSW()` from `virtual:pwa-register` in src/main.ts instead, so none is currently
    # emitted, but the rule stays so a future config change is still served correctly). All must
    # revalidate on every load so a new service-worker version is never served stale.
    location = /sw.js {
        types { text/javascript js; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /registerSW.js {
        types { text/javascript js; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ ^/workbox-[^/]+\.js$ {
        types { text/javascript js; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Content-hashed build output (index-<hash>.js/css, the lazy vexflow-engraver-<hash>.js chunk,
    # generation.worker-<hash>.js, and the self-hosted *-<hash>.woff2 faces): safe to cache for a
    # year and marked immutable, since a content change always produces a new filename. No
    # index.html fallback here -- a missing asset must 404, never silently return the app shell.
    location ^~ /assets/ {
        # A `types {}` block replaces the inherited mime.types map entirely rather than extending
        # it, so every extension actually present under dist/assets/ (js, css, woff2) must be
        # listed here, not just the one being overridden -- otherwise css/woff2 silently fall back
        # to application/octet-stream. text/css is nginx's already-correct default; restated here
        # only because it would otherwise be lost by this block existing at all.
        types {
            text/javascript js mjs;
            text/css css;
            font/woff2 woff2;
        }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else built into dist/ (icons/, licenses/): real static files, un-hashed, so no
    # long-lived immutable caching -- revalidate on every load like the other root-level files.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
