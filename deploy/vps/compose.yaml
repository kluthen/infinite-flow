# Infinite Flow on the shared VPS. Standalone project (name: infinite-flow): commands run
# here can only touch this app. Runbook: README_INFINITE_FLOW.md (this directory).
# No published port: only reachable through the VPS shared Caddy (~/caddy, container `caddy`)
# over the network caddy_infinite-flow, which only Caddy and this app join (no network in
# common with any other app). Site block: ~/caddy/conf/sites/infinite-flow.caddy.
name: infinite-flow

services:
  web:
    build: ./src
    image: infinite-flow:vps
    container_name: infinite-flow-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    # Host firewall (DOCKER-USER) drops every TCP dport 8080, container-to-container included,
    # so nginx listens on 8181 instead (patched copy of the image conf, see nginx.vps.conf).
    volumes:
      - ./nginx.vps.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/manifest.webmanifest"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - caddy_infinite-flow

networks:
  # Created once, out of band (`docker network create caddy_infinite-flow`), and listed as
  # external in ~/caddy/compose.yaml too: external here so `docker compose down` never tries to
  # remove it while Caddy is attached. Shared-Caddy convention: one network caddy_<app> per app.
  caddy_infinite-flow:
    external: true
